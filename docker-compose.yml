services:
  app:
    build: .
    image: fiber-protection:latest
    ports:
      # 宿主机端口可通过 .env 或环境变量 HOST_PORT 配置，默认 8080
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  verify:
    image: fiber-protection:latest
    build: .
    working_dir: /workspace
    environment:
      APP_PORT: "8080"
    command: ["bash", "verify/run.sh"]
    depends_on:
      app:
        condition: service_healthy

  # 页面验收：jsdom 驱动真实页面，结论只来自运行中的 app 的真实接口。
  # 依赖 verify（接口验收）成功完成，故一条命令即可顺序跑「接口 + 页面」：
  #   docker compose up --build --abort-on-container-exit --exit-code-from verify-web
  verify-web:
    build:
      context: .
      dockerfile: verify/page/Dockerfile
    environment:
      APP_URL: "http://app:8080"
    depends_on:
      app:
        condition: service_healthy
      verify:
        condition: service_completed_successfully
